name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src/yukti tests examples
      - name: Types (mypy --strict)
        run: mypy --strict src/yukti
      - name: Tests
        run: pytest tests -q
      - name: Demos run headless
        run: |
          python examples/agent-breakout/demo.py > /dev/null
          python examples/sre-reliability/demo.py > /dev/null
          python examples/data-leak-prevention/demo.py > /dev/null
          python examples/risk-engineering/demo.py > /dev/null
          python examples/cyber-governance/demo.py > /dev/null
