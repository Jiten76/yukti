[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "yukti"
version = "0.1.0"
description = "Open-source agent fleet governance: patterns, flows, decisions. Built for regulated industries."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Jitendraa Joshii" }]
requires-python = ">=3.11"
keywords = [
    "agent-governance",
    "ai-governance",
    "opentelemetry",
    "compliance",
    "risk-as-code",
    "hitl",
    "evidence-engineering",
    "regulated-industries",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]

# Minimal core deps — what every Yukti install gets.
# Core stays minimal: only what the code imports today. Provider SDKs,
# graph frameworks, and store backends arrive as extras with the
# integrations that actually use them — never as dead weight in core.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
]

# Future integrations arrive with their SDKs as extras — see docs/ROADMAP.md.
[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/Jiten76/yukti"
Documentation = "https://github.com/Jiten76/yukti/blob/main/ARCHITECTURE.md"
Repository = "https://github.com/Jiten76/yukti"
Issues = "https://github.com/Jiten76/yukti/issues"

[project.scripts]
yukti = "yukti.cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yukti"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "RUF", "SIM", "C4"]
ignore = ["E501"]  # line length handled by formatter
# Intentional Yukti vocabulary: "Pattern × Flow → Decision" is the thesis.
# These typographic characters are deliberate, not accidental confusables.
allowed-confusables = ["×", "→", "—"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --tb=short"
pythonpath = ["."]  # so tests can import the example package (examples.live_agent)
